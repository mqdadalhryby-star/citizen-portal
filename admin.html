<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - كشف بيانات الأسر</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 100%;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 1200px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .actions {
            margin-bottom: 15px;
            text-align: left;
        }
        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>كشف بيانات الأسر المسجلة (لوحة التحكم)</h2>
    
    <div class="actions">
        <button onclick="clearData()">حذف جميع البيانات</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>اسم رب الأسرة</th>
                <th>اسم الزوجة</th>
                <th>نوع الهوية ورقمها</th>
                <th>الحالة الاجتماعية</th>
                <th>المهنة</th>
                <th>عدد الأفراد (ذكور / إناث)</th>
                <th>رقم الهاتف</th>
                <th>محل الإقامة (المحافظة / العزلة / القرية)</th>
                <th>حالة صحية خاصة</th>
                <th>الاحتياجات</th>
                <th>متضررة من الحرب</th>
                <th>نوع الضرر</th>
                <th>الوضع المادي</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            <!-- سيتم تعبئة البيانات هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        // جلب البيانات المخزنة محلياً (أو ربطها لاحقاً بجدول جوجل شيت)
        let dataList = JSON.parse(localStorage.getItem('citizens')) || [];

        if (dataList.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="13" style="padding: 20px; color: #777;">لا توجد بيانات مسجلة حتى الآن.</td></tr>`;
            return;
        }

        dataList.forEach((item, index) => {
            let row = `<tr>
                <td>${item.headName || '-'}</td>
                <td>${item.spouseName || '-'}</td>
                <td>${item.idType}: ${item.idNumber || '-'}</td>
                <td>${item.socialStatus || '-'}</td>
                <td>${item.occupation || '-'}</td>
                <td>ذكور: ${item.malesCount || 0} <br> إناث: ${item.femalesCount || 0}</td>
                <td>${item.phone || '-'}</td>
                <td>${item.governorate} / ${item.district} / ${item.village}</td>
                <td>${item.healthStatus || '-'}</td>
                <td>${item.needs || '-'}</td>
                <td>${item.warAffected || '-'}</td>
                <td>${item.damageType || 'لا يوجد'}</td>
                <td>${item.economicStatus || '-'}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    function clearData() {
        if (confirm("هل أنت متأكد من رغبتك في حذف جميع البيانات المسجلة؟")) {
            localStorage.removeItem('citizens');
            loadData();
        }
    }

    // تحميل البيانات فور فتح الصفحة
    window.onload = loadData;
</script>

</body>
</html>
