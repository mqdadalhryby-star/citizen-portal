<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المواطنين - تسجيل البيانات</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة تسجيل المواطنين</h2>
    <form id="citizenForm">
        <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label>رقم الهوية:</label>
            <input type="text" id="idNumber" required>
        </div>
        <div class="form-group">
            <label>العمر:</label>
            <input type="number" id="age" required>
        </div>
        <div class="form-group">
            <label>اسم الزوجة:</label>
            <input type="text" id="spouseName">
        </div>
        <div class="form-group">
            <label>عدد الأطفال:</label>
            <input type="number" id="childrenCount" required>
        </div>
        <div class="form-group">
            <label>تاريخ التسجيل:</label>
            <input type="date" id="regDate" required>
        </div>
        <button type="submit" id="submitBtn">إرسال البيانات</button>
    </form>
    <p id="msg"></p>
</div>

<script>
    // سنقوم لاحقاً بربط رابط الـ Web App الخاص بجوجل شيت هنا
    const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    document.getElementById('citizenForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('msg');
        btn.innerText = "جاري الإرسال...";
        btn.disabled = true;

        const formData = {
            fullName: document.getElementById('fullName').value,
            idNumber: document.getElementById('idNumber').value,
            age: document.getElementById('age').value,
            spouseName: document.getElementById('spouseName').value,
            childrenCount: document.getElementById('childrenCount').value,
            regDate: document.getElementById('regDate').value
        };

        // مؤقتاً للتأكد، سنحفظها أيضاً محلياً لحين ربط الرابط السحابي نهائياً
        let dataList = JSON.parse(localStorage.getItem('citizens')) || [];
        dataList.push(formData);
        localStorage.setItem('citizens', JSON.stringify(dataList));

        setTimeout(() => {
            msg.style.color = "green";
            msg.innerText = "تم إرسال البيانات بنجاح!";
            document.getElementById('citizenForm').reset();
            btn.innerText = "إرسال البيانات";
            btn.disabled = false;
        }, 1000);
    });
</script>

</body>
</html>
