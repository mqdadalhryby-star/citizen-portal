<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجیل الأسر - البوابة المجتمعية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #007bff;
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة تسجيل بيانات الأسر</h2>
    <form id="familyForm">
        
        <div class="form-group">
            <label for="headName">اسم رب الأسرة الرباعي:</label>
            <input type="text" id="headName" required placeholder="أدخل اسم رب الأسرة كاملاً">
        </div>

        <div class="form-group">
            <label for="spouseName">اسم الزوجة:</label>
            <input type="text" id="spouseName" placeholder="أدخل اسم الزوجة (إن وجد)">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="idType">نوع الهوية:</label>
                <select id="idType">
                    <option value="بطاقة شخصية">بطاقة شخصية</option>
                    <option value="عائلية">بطاقة عائلية</option>
                    <option value="جواز سفر">جواز سفر</option>
                </select>
            </div>
            <div class="form-group">
                <label for="idNumber">رقم الهوية:</label>
                <input type="text" id="idNumber" required placeholder="أدخل رقم الهوية">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="socialStatus">الحالة الاجتماعية:</label>
                <select id="socialStatus">
                    <option value="متزوج/ة">متزوج/ة</option>
                    <option value="أرمل/ة">أرمل/ة</option>
                    <option value="مطلق/ة">مطلق/ة</option>
                </select>
            </div>
            <div class="form-group">
                <label for="occupation">المهنة:</label>
                <input type="text" id="occupation" placeholder="المهنة الحالية">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="malesCount">عدد الذكور:</label>
                <input type="number" id="malesCount" min="0" value="0">
            </div>
            <div class="form-group">
                <label for="femalesCount">عدد الإناث:</label>
                <input type="number" id="femalesCount" min="0" value="0">
            </div>
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف للتواصل:</label>
            <input type="tel" id="phone" required placeholder="مثال: 771122334">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="governorate">المحافظة:</label>
                <input type="text" id="governorate" required placeholder="المحافظة">
            </div>
            <div class="form-group">
                <label for="district">المديرية / العزلة:</label>
                <input type="text" id="district" required placeholder="المديرية أو العزلة">
            </div>
        </div>

        <div class="form-group">
            <label for="village">القرية / الحارة:</label>
            <input type="text" id="village" required placeholder="القرية أو الحارة">
        </div>

        <div class="form-group">
            <label for="healthStatus">الحالة الصحية (هل يوجد أمراض مزمنة أو إعاقات؟):</label>
            <input type="text" id="healthStatus" placeholder="اكتب التفاصيل إن وجدت، أو اتركها فارغة">
        </div>

        <div class="form-group">
            <label for="needs">الاحتياجات الملحة للأسرة:</label>
            <textarea id="needs" rows="2" placeholder="مثل: سلة غذائية، علاج، مساعدة نقدية..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="warAffected">هل الأسرة متضررة من الحرب؟</label>
                <select id="warAffected">
                    <option value="لا">لا</option>
                    <option value="نعم">نعم</option>
                </select>
            </div>
            <div class="form-group">
                <label for="damageType">نوع الضرر (إن وجد):</label>
                <input type="text" id="damageType" placeholder="تدمير منزل، نزوح، فقدان عائل...">
            </div>
        </div>

        <div class="form-group">
            <label for="economicStatus">الوضع المادي / الدخل:</label>
            <select id="economicStatus">
                <option value="بدون أي دخل">بدون أي دخل</option>
                <option value="دخل محدود جداً ومتقطع">دخل محدود جداً ومتقطع</option>
                <option value="يعتمد على المساعدات الإنسانية">يعتمد على المساعدات الإنسانية</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">إرسال البيانات عبر واتساب 📱</button>
    </form>
</div>

<script>
    document.getElementById('familyForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // جمع البيانات من الحقول
        let headName = document.getElementById('headName').value;
        let spouseName = document.getElementById('spouseName').value;
        let idType = document.getElementById('idType').value;
        let idNumber = document.getElementById('idNumber').value;
        let socialStatus = document.getElementById('socialStatus').value;
        let occupation = document.getElementById('occupation').value;
        let malesCount = document.getElementById('malesCount').value;
        let femalesCount = document.getElementById('femalesCount').value;
        let phone = document.getElementById('phone').value;
        let governorate = document.getElementById('governorate').value;
        let district = document.getElementById('district').value;
        let village = document.getElementById('village').value;
        let healthStatus = document.getElementById('healthStatus').value;
        let needs = document.getElementById('needs').value;
        let warAffected = document.getElementById('warAffected').value;
        let damageType = document.getElementById('damageType').value;
        let economicStatus = document.getElementById('economicStatus').value;

        // تنسيق رسالة واتساب باحترافية
        let message = `📋 *طلب تسجيل أسرة جديد*:\n\n` +
                      `👤 *اسم رب الأسرة:* ${headName}\n` +
                      `👩 *اسم الزوجة:* ${spouseName || 'غير متوفر'}\n` +
                      `🆔 *الهوية:* ${idType} (${idNumber})\n` +
                      `💍 *الحالة الاجتماعية:* ${socialStatus}\n` +
                      `💼 *المهنة:* ${occupation || 'غير محدد'}\n` +
                      `👥 *عدد الأفراد:* ذكور (${malesCount}) | إناث (${femalesCount})\n` +
                      `📱 *رقم الهاتف:* ${phone}\n` +
                      `📍 *العنوان:* ${governorate} - ${district} - ${village}\n` +
                      `🩺 *الحالة الصحية:* ${healthStatus || 'لا يوجد'}\n` +
                      `📦 *الاحتياجات:* ${needs || 'لا يوجد'}\n` +
                      `⚠️ *متضررة من الحرب:* ${warAffected} (${damageType || 'لا يوجد'})\n` +
                      `💰 *الوضع المادي:* ${economicStatus}`;

        let encodedMessage = encodeURIComponent(message);

        // ⚠️ هام: قم بتغيير الرقم أدناه إلى رقم هاتفك الشخصي مع رمز الدولة (بدون علامة +)
        let whatsappNumber = "967733368093"; 

        // فتح رابط واتساب بالرسالة المجهزة
        let whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;
        window.open(whatsappURL, '_blank');
    });
</script>

</body>
</html>
